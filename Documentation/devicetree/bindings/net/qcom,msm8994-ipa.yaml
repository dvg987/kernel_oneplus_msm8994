%YAML 1.2
---
$id: http://devicetree.org/schemas/net/qcom,msm8994-ipa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm IP Accelerator (IPA) v2

maintainers:
  - davigamer987 <davimarchesiprimo@gmail.com>

description:
  The IPA is a hardware block that offloads network processing (filtering,
  routing, header insertion) between the application processor and the
  modem. Unlike IPA v3 and later, which present a GSI to each execution
  environment, IPA v2 is reached through the pipes of a BAM DMA controller
  shared with the modem. The AP uses its own pipes of that BAM for IPA
  commands and for network data to and from the modem.

properties:
  compatible:
    const: qcom,msm8994-ipa

  reg:
    items:
      - description: IPA registers
      - description: IPA-local shared memory

  reg-names:
    items:
      - const: ipa-reg
      - const: ipa-shared

  interrupts:
    maxItems: 1

  interrupt-names:
    const: ipa

  clocks:
    maxItems: 1

  clock-names:
    const: core

  interconnects:
    items:
      - description: Path leading to system memory
      - description: Path leading to internal memory

  interconnect-names:
    items:
      - const: memory
      - const: imem

  dmas:
    items:
      - description: AP LAN RX pipe
      - description: AP command TX pipe
      - description: AP to modem TX pipe
      - description: Modem to AP RX pipe

  dma-names:
    items:
      - const: ap_lan_rx
      - const: cmd_tx
      - const: ap_modem_tx
      - const: ap_modem_rx

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - interconnects
  - interconnect-names
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmcc.h>
    #include <dt-bindings/interconnect/qcom,msm8994.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ipa@fd4e0000 {
        compatible = "qcom,msm8994-ipa";
        reg = <0xfd4e0000 0x5000>,
              <0xfd4e5000 0x2000>;
        reg-names = "ipa-reg", "ipa-shared";
        interrupts = <GIC_SPI 301 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "ipa";
        clocks = <&rpmcc RPM_SMD_IPA_CLK>;
        clock-names = "core";
        interconnects = <&snoc SNOC_MAS_IPA &bimc BIMC_SLV_EBI_CH0>,
                        <&snoc SNOC_MAS_IPA &snoc SNOC_SLV_OCIMEM>;
        interconnect-names = "memory", "imem";
        dmas = <&ipa_bam 2>, <&ipa_bam 3>, <&ipa_bam 4>, <&ipa_bam 5>;
        dma-names = "ap_lan_rx", "cmd_tx", "ap_modem_tx", "ap_modem_rx";
    };
