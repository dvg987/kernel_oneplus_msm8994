%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,q6voice.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm DSP voice services (Q6MVM, Q6CVS, Q6CVP)

maintainers:
  - davigamer987 <davimarchesiprimo@gmail.com>

description:
  The Multimode Voice Manager (MVM), Core Voice Stream (CVS) and Core Voice
  Processor (CVP) are APR services of the QDSP6 that carry circuit-switched
  voice calls between the modem vocoder and the audio ports. The MVM node
  holds the voice front-end DAI.

allOf:
  - $ref: /schemas/soc/qcom/qcom,apr-services.yaml#
  - if:
      properties:
        compatible:
          const: qcom,q6mvm
    then:
      required:
        - dais
    else:
      properties:
        dais: false

properties:
  compatible:
    enum:
      - qcom,q6cvp
      - qcom,q6cvs
      - qcom,q6mvm

  dais:
    type: object
    additionalProperties: false
    description: Voice call front end (CS-Voice)

    properties:
      compatible:
        const: qcom,q6voice-dais

      "#sound-dai-cells":
        const: 0

    required:
      - compatible
      - "#sound-dai-cells"

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/soc/qcom,apr.h>

    apr {
        #address-cells = <1>;
        #size-cells = <0>;

        service@9 {
            compatible = "qcom,q6mvm";
            reg = <APR_SVC_ADSP_MVM>;

            dais {
                compatible = "qcom,q6voice-dais";
                #sound-dai-cells = <0>;
            };
        };

        service@a {
            compatible = "qcom,q6cvs";
            reg = <APR_SVC_ADSP_CVS>;
        };

        service@b {
            compatible = "qcom,q6cvp";
            reg = <APR_SVC_ADSP_CVP>;
        };
    };
