%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,msm8994-qmp-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm QMP PHY controller (PCIe, MSM8994)

maintainers:
  - Vinod Koul <vkoul@kernel.org>

description:
  The 20nm QMP PHY found next to each of the two PCIe root complexes of
  MSM8992 and MSM8994.

properties:
  compatible:
    const: qcom,msm8994-qmp-pcie-phy

  reg:
    items:
      - description: serdes

  clocks:
    maxItems: 4

  clock-names:
    items:
      - const: cfg_ahb
      - const: ref
      - const: ldo
      - const: pipe

  power-domains:
    maxItems: 1

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: phy
      - const: common

  vdda-phy-supply: true

  vdda-pll-supply: true

  "#clock-cells":
    const: 0

  clock-output-names:
    maxItems: 1

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - vdda-phy-supply
  - vdda-pll-supply
  - "#clock-cells"
  - clock-output-names
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8994.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>

    phy@fc52e000 {
        compatible = "qcom,msm8994-qmp-pcie-phy";
        reg = <0xfc52e000 0x1000>;

        clocks = <&gcc GCC_PCIE_1_CFG_AHB_CLK>,
                 <&rpmcc RPM_SMD_LN_BB_CLK>,
                 <&gcc PCIE_1_PHY_LDO>,
                 <&gcc GCC_PCIE_1_PIPE_CLK>;
        clock-names = "cfg_ahb",
                      "ref",
                      "ldo",
                      "pipe";

        clock-output-names = "pcie_1_pipe_clk";
        #clock-cells = <0>;

        #phy-cells = <0>;

        power-domains = <&gcc PCIE_1_GDSC>;

        resets = <&gcc PCIE_PHY_1_PHY_RESET>, <&gcc PCIE_PHY_1_RESET>;
        reset-names = "phy", "common";

        vdda-phy-supply = <&vreg_l28a_1p0>;
        vdda-pll-supply = <&vreg_l12a_1p8>;
    };
