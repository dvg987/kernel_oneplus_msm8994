%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,msm8994-cpucc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8994 CPU Clock Controller

maintainers:
  - Bjorn Andersson <andersson@kernel.org>

description: |
  The CPU clock controller of MSM8994 drives the two CPU clusters, each from
  a pair of PLLs and a pair of muxes.

  Clock specifier: 0 for the Cortex-A53 cluster, 1 for the Cortex-A57
  cluster.

properties:
  compatible:
    const: qcom,msm8994-cpucc

  reg:
    items:
      - description: Cortex-A53 cluster PLLs
      - description: Cortex-A57 cluster PLLs
      - description: Cortex-A57 cluster APCS global block

  clocks:
    items:
      - description: XO source

  clock-names:
    items:
      - const: xo

  '#clock-cells':
    const: 1

  qcom,apcs:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The APCS global block of the Cortex-A53 cluster, which holds that
      cluster's clock muxes besides the IPC mailbox.

  power-domains:
    maxItems: 1

  required-opps:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - qcom,apcs

additionalProperties: false

examples:
  - |
    clock-controller@f9015000 {
        compatible = "qcom,msm8994-cpucc";
        reg = <0xf9015000 0x1000>,
              <0xf9016000 0x1000>,
              <0xf900f000 0x1000>;
        clocks = <&xo_board>;
        clock-names = "xo";
        #clock-cells = <1>;
        qcom,apcs = <&apcs>;
    };
...
